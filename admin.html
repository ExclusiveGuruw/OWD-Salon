<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | Owd Salon</title>
<link rel="stylesheet" href="pages.css">
<style>
    .admin-shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 20px 64px;
    }

    .dashboard-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 24px;
        flex-wrap: wrap;
    }

    .admin-overview {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 18px;
        margin-bottom: 28px;
    }

    .admin-card {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 18px;
        padding: 22px;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
    }

    .admin-card h3 {
        margin: 8px 0;
        font-size: 2rem;
    }

    .admin-card p {
        margin: 0;
    }

    .booking-list {
        display: grid;
        gap: 14px;
    }

    .admin-booking {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 18px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .admin-booking-info {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .admin-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }

    .admin-actions select,
    .admin-actions button {
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .delete-button {
        background: #d9534f;
        color: white;
        border: none;
        cursor: pointer;
    }

    @media (max-width: 768px) {
        .admin-booking {
            flex-direction: column;
            align-items: flex-start;
        }
    }
</style>
</head>
<body>
<div id="pageLoader" class="page-loader">
    <div class="loader-brand">Owd Salon</div>
    <div class="loader-ring" aria-label="Loading"></div>
</div>

<header class="navbar">
    <a href="index.html" class="logo">Owd Salon</a>
    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="booking.html">Book</a>
        <a href="contact.html">Contact</a>
        <a href="about.html">About Us</a>
        <a href="reviews.html">Reviews</a>
        <button id="logoutButton" class="nav-button hidden">Logout</button>
    </nav>
</header>

<main class="admin-shell">
    <section class="section">
        <div class="dashboard-header">
            <div>
                <p class="small-title">ADMIN DASHBOARD</p>
                <h1>Salon Bookings</h1>
            </div>
        </div>

        <div id="adminOverview" class="admin-overview"></div>

        <div id="adminBookings" class="booking-list"></div>
    </section>
</main>

<footer>
    © 2026 Owd Salon<br>
    Beauty made personal.
</footer>

<script src="account.js" defer></script>
<script src="admin.js" defer></script>
<script src="loader.js" defer></script>
</body>
</html>
